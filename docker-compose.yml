version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: trip-planner-postgres
    environment:
      POSTGRES_DB: tripplanner
      POSTGRES_USER: tripplanner
      POSTGRES_PASSWORD: tripplanner
    ports:
      - "5432:5432"
    volumes:
      - trip-planner-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tripplanner"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: trip-planner-backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/tripplanner
      DB_USER: tripplanner
      DB_PASSWORD: tripplanner
      JWT_SECRET: change-this-super-secret-key-should-be-at-least-256-bits-long
      CORS_ALLOWED_ORIGINS: http://localhost:5173
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./frontend
    container_name: trip-planner-frontend
    depends_on:
      - backend
    environment:
      VITE_API_BASE_URL: http://localhost:8080
    ports:
      - "5173:5173"

volumes:
  trip-planner-pgdata:
