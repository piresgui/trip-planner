server:
  port: 8080

spring:
  application:
    name: trip-planner-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/tripplanner}
    username: ${DB_USER:tripplanner}
    password: ${DB_PASSWORD:tripplanner}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  jackson:
    serialization:
      write-dates-as-timestamps: false

app:
  jwt:
    # In production this MUST come from an environment variable / secret manager, never hardcoded.
    secret: ${JWT_SECRET:change-this-super-secret-key-should-be-at-least-256-bits-long}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

logging:
  level:
    com.tripplanner: INFO
